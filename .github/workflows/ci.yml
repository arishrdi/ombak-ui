name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, registry, bundle budget, smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (registry + site)
        run: npm run build

      - name: Registry output is committed
        run: |
          if ! git diff --quiet -- public/r components/site/playground-map.tsx; then
            git diff --stat -- public/r components/site/playground-map.tsx
            echo "::error::Generated files are out of date. Run 'npm run registry:build' and commit public/r and components/site/playground-map.tsx."
            exit 1
          fi

      - name: Validate registry
        run: npm run check:registry

      - name: Start production server
        run: |
          npx next start -p 3123 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3123 > /dev/null && exit 0; sleep 1; done
          cat next.log; exit 1

      - name: Bundle budget
        run: npm run check:bundle

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            next.log
          retention-days: 7
